<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ადმინ პანელი | Gla MOre</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 30px; background: #f4f6f9; }
    .admin-container { max-width: 1000px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #d47a85; color: white; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .media-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
    .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 15px; }
    .offer-item { background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>⚙️ Gla More — ადმინისტრატორის პანელი</h1>

    <!-- 1. აქტიური ჯავშნების მართვა -->
    <div class="card">
      <h2>📅 ჯავშნების მართვა</h2>
      <table>
        <thead>
          <tr>
            <th>მომხმარებელი</th>
            <th>ტელეფონი</th>
            <th>სერვისი</th>
            <th>თარიღი</th>
            <th>დრო</th>
            <th>მოქმედება</th>
          </tr>
        </thead>
        <tbody id="bookingsTable">
          <!-- დინამიურად შეივსება -->
        </tbody>
      </table>
    </div>

    <!-- 2. ფოტოს/ვიდეოს და შეთავაზების დამატება -->
    <div class="card">
      <h2>📸 ახალი შეთავაზების / ფოტო-ვიდეოს დადება</h2>
      <form id="offerForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>სათაური / აღწერა:</label>
          <input type="text" id="offerTitle" placeholder="მაგ: შილაკი + დიზაინი საჩუქრად" required>
        </div>
        <div class="form-group">
          <label>ფასი (₾):</label>
          <input type="text" id="offerPrice" placeholder="მაგ: 45 ₾" required>
        </div>
        <div class="form-group">
          <label>აირჩიეთ ფოტო ან ვიდეო:</label>
          <input type="file" id="offerMedia" accept="image/*,video/*" required>
        </div>
        <button type="submit" class="btn-submit">გამოქვეყნება</button>
      </form>
    </div>

    <!-- 3. არსებული შეთავაზებები -->
    <div class="card">
      <h2>🖼️ ატვირთული შეთავაზებები</h2>
      <div id="offersGrid" class="offers-grid"></div>
    </div>
  </div>

  <script>
    // ჯავშნების წამოღება
    async function loadBookings() {
      const res = await fetch('/api/admin/bookings');
      const data = await res.json();
      const tbody = document.getElementById('bookingsTable');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ჯავშნები ჯერ არ არის.</td></tr>';
        return;
      }

      data.forEach(b => {
        tbody.innerHTML += `
          <tr>
            <td>${b.name}</td>
            <td>${b.phone}</td>
            <td><strong>${b.service}</strong></td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td><button class="btn-delete" onclick="deleteBooking(${b.id})">❌ გაუქმება</button></td>
          </tr>
        `;
      });
    }

    // ჯავშნის გაუქმება (საათის გათავისუფლება)
    async function deleteBooking(id) {
      if (confirm('ნამდვილად გსურთ ამ ჯავშნის გაუქმება? საათი ხელახლა გათავისუფლდება საიტზე.')) {
        await fetch(`/api/admin/bookings/${id}`, { method: 'DELETE' });
        loadBookings();
      }
    }

    // შეთავაზებების წამოღება
    async function loadOffers() {
      const res = await fetch('/api/offers');
      const data = await res.json();
      const grid = document.getElementById('offersGrid');
      grid.innerHTML = '';

      data.forEach(o => {
        const mediaTag = o.mediaType === 'video' 
          ? `<video src="${o.mediaUrl}" class="media-preview" controls></video>`
          : `<img src="${o.mediaUrl}" class="media-preview">`;

        grid.innerHTML += `
          <div class="offer-item">
            ${mediaTag}
            <h4 style="margin: 8px 0;">${o.title}</h4>
            <p style="color: #d47a85; font-weight: bold;">${o.price}</p>
            <button class="btn-delete" style="margin-top: 8px;" onclick="deleteOffer(${o.id})">წაშლა</button>
          </div>
        `;
      });
    }

    // შეთავაზების დამატება
    document.getElementById('offerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('offerTitle').value);
      formData.append('price', document.getElementById('offerPrice').value);
      formData.append('media', document.getElementById('offerMedia').files[0]);

      const res = await fetch('/api/admin/offers', { method: 'POST', body: formData });
      const result = await res.json();

      if (result.success) {
        alert('შეთავაზება წარმატებით დაემატა!');
        document.getElementById('offerForm').reset();
        loadOffers();
      }
    });

    // შეთავაზების წაშლა
    async function deleteOffer(id) {
      if (confirm('წაიშალოს შეთავაზება?')) {
        await fetch(`/api/admin/offers/${id}`, { method: 'DELETE' });
        loadOffers();
      }
    }

    loadBookings();
    loadOffers();
  </script>
</body>
</html>
